<!DOCTYPE html>
<html lang="es-CO">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gestión comercial · cuentas de cobro, ventas, compras y CRM</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Figtree:wght@400;500;600&display=swap">
<style>
:root{
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#F2F4F7;--surface:#fff;--surface2:#F7F8FA;--ink:#172033;--muted:#5B667A;--line:#DDE2EA;
  --pri:#1B4DB1;--pri-ink:#fff;--pri-soft:#E6EDFB;--acc:#F5C400;
  --ok:#1F7A52;--ok-soft:#DFF3EA;--warn:#9A6212;--warn-soft:#FBF0D5;--bad:#B93434;--bad-soft:#FBE4E4;--info:#1B4DB1;--info-soft:#E6EDFB;
  --side:#0F1B33;--side-ink:#C9D3E8;--shadow:0 1px 2px rgba(15,27,51,.06),0 10px 28px rgba(15,27,51,.08);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1220;--surface:#151C2E;--surface2:#1A2338;--ink:#E8ECF5;--muted:#93A0B8;--line:#27324D;
    --pri:#7AA7FF;--pri-ink:#0D1220;--pri-soft:#1E2B4A;--ok:#5ED19A;--ok-soft:#173A2C;--warn:#F0C26B;--warn-soft:#3A2F14;--bad:#FF8A8A;--bad-soft:#3F1D1F;--info:#7AA7FF;--info-soft:#1E2B4A;
    --side:#090E1A;--side-ink:#B4C0D8;--shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#0D1220;--surface:#151C2E;--surface2:#1A2338;--ink:#E8ECF5;--muted:#93A0B8;--line:#27324D;
  --pri:#7AA7FF;--pri-ink:#0D1220;--pri-soft:#1E2B4A;--ok:#5ED19A;--ok-soft:#173A2C;--warn:#F0C26B;--warn-soft:#3A2F14;--bad:#FF8A8A;--bad-soft:#3F1D1F;--info:#7AA7FF;--info-soft:#1E2B4A;
  --side:#090E1A;--side-ink:#B4C0D8;--shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:15px;line-height:1.5}
h1,h2,h3{font-family:'Bricolage Grotesque','Figtree',system-ui,sans-serif;margin:0;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
[hidden]{display:none!important}
.app{display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100dvh}
.side{background:var(--side);color:var(--side-ink);position:sticky;top:0;height:100dvh;overflow:auto;padding:18px 12px;display:flex;flex-direction:column;gap:2px}
.brand{padding:4px 12px 14px}
.brand b{display:block;font-family:'Bricolage Grotesque',sans-serif;font-size:19px;color:#fff;line-height:1.2}
.brand span{font-size:12.5px;opacity:.7}
.flagbar{height:4px;margin:0 12px 10px;border-radius:2px;background:linear-gradient(90deg,#FCD116 0 50%,#003893 50% 75%,#CE1126 75% 100%)}
.grp{font-size:12.5px;opacity:.55;margin:14px 12px 4px}
.nv{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:8px;cursor:pointer;color:inherit;background:none;border:0;width:100%;text-align:left}
.nv:hover{background:rgba(255,255,255,.06)}
.nv.on{background:rgba(255,255,255,.1);color:#fff;box-shadow:inset 3px 0 0 var(--acc)}
.main{padding:18px 28px 48px;min-width:0}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px;position:relative}
.top .l{display:flex;align-items:center;gap:10px}
.menu-btn{display:none}
.me{display:flex;align-items:center;gap:10px}
.me .who{line-height:1.2;text-align:right}.me .who small{color:var(--muted);display:block;font-size:12.5px}
.av{width:34px;height:34px;border-radius:50%;background:var(--pri-soft);color:var(--pri);display:inline-flex;align-items:center;justify-content:center;font-weight:600;font-size:13px;flex:none}
.av.sm{width:24px;height:24px;font-size:10.5px}
.ib{background:none;border:1px solid var(--line);border-radius:8px;width:36px;height:36px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink);position:relative}
.ib:hover{background:var(--surface2)}
.ib.t{width:30px;height:30px;border-color:transparent}
.dot{position:absolute;top:-5px;right:-5px;background:var(--bad);color:#fff;font-size:11px;min-width:18px;height:18px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 4px}
.notif{position:absolute;right:0;top:44px;width:min(380px,92vw);background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);z-index:30;max-height:70vh;overflow:auto}
.notif h3{padding:12px 14px;font-size:15px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line)}
.ni{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:10px 14px;cursor:pointer}
.ni:hover{background:var(--surface2)}.ni.un{background:var(--pri-soft)}.ni small{color:var(--muted)}
.vh{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap;margin-bottom:16px}
.vh h1{font-size:27px}.sub{margin:2px 0 0;color:var(--muted)}
.vr{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 14px;border-radius:9px;cursor:pointer;font-weight:500}
.btn:hover{background:var(--surface2)}
.btn.pri{background:var(--pri);border-color:var(--pri);color:var(--pri-ink)}.btn.pri:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:5px 10px;font-size:13.5px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.lnk{background:none;border:0;color:var(--pri);cursor:pointer;font-weight:600;padding:0}
.lnk:hover{text-decoration:underline}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
.pad{padding:16px 18px}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.bar input[type=search],.bar select{min-width:180px}
input,select,textarea{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
input[type=checkbox]{width:auto}
textarea{resize:vertical}
label{display:flex;flex-direction:column;gap:5px;font-size:13.5px;color:var(--muted)}
label.ck{flex-direction:row;align-items:center;gap:8px;color:var(--ink)}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.scroll{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse}
.tbl th{font-weight:600;text-align:left;color:var(--muted);font-size:13.5px;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl .num,.tbl th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.acts{white-space:nowrap;text-align:right}
.bd{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12.5px;font-weight:600;background:var(--surface2);color:var(--muted)}
.bd.ok{background:var(--ok-soft);color:var(--ok)}.bd.warn{background:var(--warn-soft);color:var(--warn)}.bd.bad{background:var(--bad-soft);color:var(--bad)}.bd.info{background:var(--info-soft);color:var(--info)}
select.est{width:auto;padding:3px 8px;font-size:13px;border-radius:99px}
.empty{padding:34px 18px;text-align:center;color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:16px}
.tile{padding:14px 16px}.tile small{color:var(--muted)}.tile .v{font-family:'Bricolage Grotesque',sans-serif;font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;margin:2px 0}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px}
.li{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}.li:last-child{border-bottom:0}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:4px 12px;cursor:pointer;font-size:13.5px}
.chip.on{background:var(--pri);color:var(--pri-ink);border-color:var(--pri)}
.board{display:flex;gap:12px;overflow-x:auto;align-items:flex-start;padding-bottom:14px}
.col{flex:0 0 285px;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:10px;min-height:120px}
.col.over{outline:2px dashed var(--pri);outline-offset:-2px}
.col>header{display:flex;justify-content:space-between;align-items:baseline;padding:2px 4px 4px;gap:8px}
.col>header b{font-family:'Bricolage Grotesque',sans-serif}
.col>header small{color:var(--muted);font-variant-numeric:tabular-nums}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 11px;margin-top:8px;cursor:pointer}
.card:hover{border-color:var(--pri)}
.card .ct{font-weight:600;margin-bottom:4px}
.card .cm{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0}
.card .cf{display:flex;justify-content:space-between;align-items:center;gap:8px;color:var(--muted);font-size:13px;margin-top:6px}
.card .cx{display:flex;gap:4px;margin-top:8px;flex-wrap:wrap}
.late{color:var(--bad);font-weight:600}
.flow{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 14px}
.step{padding:4px 11px;border-radius:99px;font-size:13px;border:1px solid var(--line);color:var(--muted)}
.step.done{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.step.now{background:var(--pri);color:var(--pri-ink);border-color:var(--pri);font-weight:600}
#modal .ov{position:fixed;inset:0;background:rgba(8,12,24,.6);display:flex;align-items:flex-start;justify-content:center;padding:calc(20px + env(safe-area-inset-top,0px)) 12px 24px;overflow:auto;z-index:60}
.mdl{background:var(--surface);border-radius:14px;max-width:720px;width:100%;box-shadow:var(--shadow)}
.mdl.wide{max-width:960px}.mdl.sm{max-width:460px}
.mh{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.mh h2{font-size:20px}
.mb{padding:16px 18px;display:flex;flex-direction:column;gap:14px}
.mf{display:flex;justify-content:flex-end;gap:8px;padding:12px 18px;border-top:1px solid var(--line);flex-wrap:wrap}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;padding:12px 18px;border-bottom:1px solid var(--line)}
.err{color:var(--bad);background:var(--bad-soft);padding:8px 12px;border-radius:8px;font-size:14px}
.items{width:100%;border-collapse:collapse}
.items th{font-size:13px;color:var(--muted);text-align:left;font-weight:600;padding:4px 4px}
.items td{padding:4px;vertical-align:middle}
.items .lt{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums;padding-right:6px}
.totbox{margin-left:auto;min-width:260px}
.totbox div{display:flex;justify-content:space-between;gap:20px;padding:3px 0;font-variant-numeric:tabular-nums}
.totbox .big{font-weight:700;font-size:17px;border-top:1px solid var(--line);margin-top:4px;padding-top:7px}
.matrix th,.matrix td{padding:8px 10px;text-align:center;border-bottom:1px solid var(--line)}
.matrix th:first-child,.matrix td:first-child{text-align:left}
.matrix .gr td{background:var(--surface2);font-weight:600;color:var(--muted);text-align:left}
.login{max-width:760px;margin:0 auto;padding:48px 18px}
.login h1{font-size:34px;margin-bottom:6px}
.ugrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;margin-top:18px}
.ucard{display:flex;gap:12px;align-items:center;text-align:left;padding:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;cursor:pointer}
.ucard:hover{border-color:var(--pri)}
.ucard small{color:var(--muted);display:block}
#toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:90;max-width:90vw;box-shadow:var(--shadow)}
.paper{background:#fff;color:#1b1b1b;max-width:800px;margin:0 auto;padding:0 36px 30px;font-size:13.5px;border:1px solid #d9d9d9;overflow:hidden;font-family:'Figtree',system-ui,sans-serif;line-height:1.45}
.paper .flag{height:9px;background:linear-gradient(90deg,#FCD116 0 50%,#003893 50% 75%,#CE1126 75% 100%);margin:0 -36px 22px}
.paper .ph{display:flex;justify-content:space-between;gap:20px;margin-bottom:18px}
.paper .pco{font-family:'Bricolage Grotesque',sans-serif;font-size:19px;font-weight:700}
.paper .pnum{text-align:right}.paper .ptitle{font-family:'Bricolage Grotesque',sans-serif;font-size:19px;font-weight:700}
.paper .pn{font-size:17px;font-weight:600}
.paper .pbox{border:1px solid #d6d6d6;border-radius:6px;padding:10px 12px;margin-bottom:14px}
.paper .pbox small{color:#666;display:block}
.paper table.pt{width:100%;border-collapse:collapse;margin:8px 0 12px}
.paper .pt th{text-align:left;border-bottom:2px solid #1b1b1b;padding:6px 6px;font-size:12.5px}
.paper .pt td{border-bottom:1px solid #e3e3e3;padding:6px}
.paper .r{text-align:right;font-variant-numeric:tabular-nums}
.paper .totbox{color:#1b1b1b}.paper .totbox .big{border-color:#1b1b1b}
.paper .letras{margin:10px 0;padding:8px 10px;background:#f5f5f5;border-radius:4px}
.paper .firmas{display:flex;gap:40px;margin-top:54px}
.paper .firmas div{flex:1;border-top:1px solid #1b1b1b;padding-top:5px;font-size:12.5px}
.paper .legal{font-size:12px;color:#555;margin-top:14px}
.paper .estado{display:inline-block;border:1.5px solid #1b1b1b;border-radius:4px;padding:1px 8px;font-weight:600;margin-top:4px;font-size:12.5px}
.paper .estado.anul{border-color:#CE1126;color:#CE1126}
.paper .cc p{margin:8px 0}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:0;bottom:0;width:272px;z-index:40;transform:translateX(-100%);transition:transform .18s ease;height:100dvh;padding-top:calc(18px + env(safe-area-inset-top,0px))}
  .menu-open .side{transform:none}
  .menu-btn{display:inline-flex}
  .main{padding:14px 14px 40px}
  .me .who{display:none}
}
@media (prefers-reduced-motion:reduce){.side{transition:none}}
@media print{
  #app,.noprint,#toast{display:none!important}
  body{background:#fff}
  #modal .ov{position:static!important;padding:0!important;background:#fff!important;display:block!important;overflow:visible!important}
  .mdl{box-shadow:none!important;max-width:none!important;background:#fff!important}
  .mb{padding:0!important}
  .paper{border:0!important;max-width:none!important}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal"></div>
<div id="toast" hidden></div>
<script>
(function(){
'use strict';
/* ---------- utilidades ---------- */
const $=s=>document.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const COP=new Intl.NumberFormat('es-CO',{style:'currency',currency:'COP',maximumFractionDigits:0});
const money=n=>COP.format(Math.round(+n||0));
const pad2=n=>String(n).padStart(2,'0');
const isoOf=d=>d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());
const today=()=>isoOf(new Date());
const addDays=(s,n)=>{const d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return isoOf(d);};
const fdate=s=>{if(!s)return '—';const p=s.split('-');return p[2]+'/'+p[1]+'/'+p[0];};
const flong=s=>new Date(s+'T12:00:00').toLocaleDateString('es-CO',{day:'numeric',month:'long',year:'numeric'});
const ftime=ts=>new Date(ts).toLocaleString('es-CO',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});
const initials=n=>(n||'?').split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase();
const clone=o=>JSON.parse(JSON.stringify(o));

function numALetras(n){
  n=Math.round(n);if(n===0)return 'cero';
  const U=['','uno','dos','tres','cuatro','cinco','seis','siete','ocho','nueve','diez','once','doce','trece','catorce','quince','dieciséis','diecisiete','dieciocho','diecinueve','veinte','veintiuno','veintidós','veintitrés','veinticuatro','veinticinco','veintiséis','veintisiete','veintiocho','veintinueve'];
  const D=['','','','treinta','cuarenta','cincuenta','sesenta','setenta','ochenta','noventa'];
  const C=['','ciento','doscientos','trescientos','cuatrocientos','quinientos','seiscientos','setecientos','ochocientos','novecientos'];
  const apo=s=>s.replace(/veintiuno$/,'veintiún').replace(/uno$/,'un');
  const m1000=x=>{if(x===100)return 'cien';let s='';const c=Math.floor(x/100),r=x%100;if(c)s+=C[c]+(r?' ':'');if(r<30)s+=U[r];else{const d=Math.floor(r/10),u=r%10;s+=D[d]+(u?' y '+U[u]:'');}return s;};
  const miles=x=>{const m=Math.floor(x/1000),r=x%1000;let s='';if(m)s+=(m===1?'mil':apo(m1000(m))+' mil');if(r)s+=(s?' ':'')+m1000(r);return s;};
  const mm=Math.floor(n/1e6),r=n%1e6;let s='';
  if(mm)s+=(mm===1?'un millón':apo(miles(mm))+' millones');
  if(r)s+=(s?' ':'')+miles(r);
  return s;
}
function enLetras(n){const x=Math.round(+n||0);const t=numALetras(x);const de=(x>0&&x%1e6===0)?' de':'';const s=t+de+' pesos m/cte.';return s.charAt(0).toUpperCase()+s.slice(1);}

const ICON={
 home:'<path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/>',
 users:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"/><circle cx="17" cy="9" r="2.5"/><path d="M17 14c2.6 0 4.5 1.8 4.5 4.5"/>',
 shield:'<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/>',
 sliders:'<path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/>',
 file:'<path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4M9 12h6M9 16h6"/>',
 receipt:'<path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/>',
 clip:'<path d="M9 3h6v3H9z"/><path d="M6 5h12v16H6z"/><path d="M9 12h6M9 16h4"/>',
 cash:'<rect x="3" y="7" width="18" height="10" rx="2"/><circle cx="12" cy="12" r="2.5"/>',
 bag:'<path d="M5 7h14l-1 13H6z"/><path d="M9 7a3 3 0 016 0"/>',
 kanban:'<rect x="3" y="4" width="5" height="16" rx="1"/><rect x="10" y="4" width="5" height="10" rx="1"/><rect x="17" y="4" width="4" height="13" rx="1"/>',
 check:'<path d="M5 12l5 5 9-10"/>',
 bell:'<path d="M6 17V11a6 6 0 0112 0v6l2 2H4z"/><path d="M10 21h4"/>',
 plus:'<path d="M12 5v14M5 12h14"/>',edit:'<path d="M4 20h4L19 9l-4-4L4 16z"/>',
 trash:'<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>',
 eye:'<path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
 x:'<path d="M6 6l12 12M18 6L6 18"/>',
 right:'<path d="M5 12h14M13 6l6 6-6 6"/>',left:'<path d="M19 12H5M11 6l-6 6 6 6"/>',
 menu:'<path d="M4 6h16M4 12h16M4 18h16"/>',out:'<path d="M9 4H5v16h4M16 8l4 4-4 4M20 12H9"/>',
 print:'<path d="M7 9V3h10v6M6 17H4v-7h16v7h-2M7 14h10v7H7z"/>',

function docSave(go){
  const d=DRAFT,T=DT[d.tipo];
  if(!d.partyId)return err('Elige '+(T.party==='cliente'?'un cliente':'un proveedor')+'.');
  if(T.mode==='items'){
    const its=d.items.filter(i=>(i.desc||'').trim()||(+i.price));
    if(!its.length||its.some(i=>!(i.desc||'').trim()||!(+i.price>0)))return err('Cada línea necesita descripción y un valor mayor a cero.');
    d.items=its.map(i=>({desc:i.desc.trim(),qty:+i.qty||1,price:+i.price,iva:T.iva?(+i.iva||0):0}));
  }else{
    if(!(+d.valor>0))return err('Escribe un valor mayor a cero.');
    if(!(d.concepto||'').trim())return err('Escribe el concepto.');
    d.valor=+d.valor;d.items=[];
  }
  d.ret=+d.ret||0;
  const isNew=d._new;delete d._new;
  if(isNew){d.num=T.pre+'-'+String(S.consec[T.pre]++).padStart(4,'0');S.docs.push(d);}
  else{const i=S.docs.findIndex(x=>x.id===d.id);S.docs[i]=d;}
  if(d.origen&&d.tipo==='factura_venta'){const o=S.docs.find(x=>x.id===d.origen);if(o&&o.tipo==='cotizacion')o.estado='Aprobada';}
  syncPagos();save();closeModal();render();toast(T.n+' '+d.num+' guardada.');
  if(go==='view')openPreview(d.id);
}

function openTask(id){
  DRAFT={comment:''};
  openModal(()=>{
    const t=S.tasks.find(x=>x.id===id);if(!t)return mhead('Tarea')+'<div class="mb">La tarea ya no existe.</div>';
    const u=cur(),idx=S.areas.findIndex(a=>a.id===t.areaId),next=S.areas[idx+1],prev=idx>0?S.areas[idx-1]:null;
    const mine=t.areaId&&(u.areaId===t.areaId||can('tareas','todo'))&&can('tareas','editar');
    const flow=S.areas.map((a,i)=>'<span class="step '+(!t.areaId||i<idx?'done':(i===idx?'now':''))+'">'+esc(a.nombre)+'</span>').join('');
    const acts=[];
    if(mine&&t.asignado!==u.id)acts.push('<button class="btn" data-a="taskTake" data-id="'+id+'">Tomar tarea</button>');
    if(mine&&prev)acts.push('<button class="btn" data-a="taskBack" data-id="'+id+'">Devolver a '+esc(prev.nombre)+'</button>');
    if(mine)acts.push('<button class="btn pri" data-a="taskPass" data-id="'+id+'">'+(next?'Finalizar y pasar a '+esc(next.nombre):'Finalizar tarea')+'</button>');
    return mhead(esc(t.titulo))+'<div class="mb"><div>'+bd(t.prioridad,{Alta:'bad',Media:'warn',Baja:''}[t.prioridad])+' '+(t.areaId?bd(t.estado,t.estado==='En curso'?'info':''):bd('Completada','ok'))+'</div><div class="flow" aria-label="Recorrido por áreas">'+flow+'</div>'
     +(t.desc?'<p style="margin:0">'+esc(t.desc)+'</p>':'')+'<div class="g2"><div><small style="color:var(--muted)">Asignada a</small><br>'+esc(t.asignado?userName(t.asignado):'Sin asignar')+'</div><div><small style="color:var(--muted)">Creada por</small><br>'+esc(userName(t.creador))+'</div><div><small style="color:var(--muted)">Fecha límite</small><br>'+fdate(t.vence)+'</div>'+(t.clienteId?'<div><small style="color:var(--muted)">Cliente</small><br>'+esc(partyName(t.clienteId))+'</div>':'')+(t.docRef?'<div><small style="color:var(--muted)">Documento</small><br>'+esc(t.docRef)+'</div>':'')+'</div>'
     +'<div><h3 style="font-size:16px;margin-bottom:6px">Historial</h3>'+t.hist.slice().reverse().map(h=>'<div class="li"><span>'+esc(h.txt)+'<br><small style="color:var(--muted)">'+esc(userName(h.u))+'</small></span><small style="color:var(--muted);white-space:nowrap">'+ftime(h.ts)+'</small></div>').join('')+'</div>'
     +(can('tareas','editar')?lb('Nota (obligatoria para devolver a un área anterior)',fa('comment',DRAFT.comment,2))+'<div><button class="btn sm" data-a="taskComment" data-id="'+id+'">Agregar nota</button></div>':'')+'<div class="err" id="err" hidden></div></div>'
     +'<div class="mf">'+(can('tareas','eliminar')?'<button class="btn danger" data-a="taskDel" data-id="'+id+'" style="margin-right:auto">Eliminar</button>':'')+(can('tareas','editar')?'<button class="btn" data-a="taskEdit" data-id="'+id+'">Editar</button>':'')+acts.join('')+'</div>';
  },'');
}
function passTask(id){
  const t=S.tasks.find(x=>x.id===id),u=cur(),idx=S.areas.findIndex(a=>a.id===t.areaId),next=S.areas[idx+1],from=areaName(t.areaId);
  const note=(DRAFT&&DRAFT.comment||'').trim();if(note)t.hist.push({ts:Date.now(),u:u.id,txt:'Nota: '+note});
  let msg;
  if(next){t.areaId=next.id;t.estado='Por hacer';t.asignado=null;t.hist.push({ts:Date.now(),u:u.id,txt:'Finalizó en '+from+' y pasó a '+next.nombre});
    const rec=recipientsForArea(next.id);let n=notify(rec,'«'+t.titulo+'» llegó a '+next.nombre+' desde '+from+' ('+u.nombre+')',t.id);
    if(t.creador!==u.id&&!rec.includes(t.creador))notify([t.creador],'«'+t.titulo+'» avanzó a '+next.nombre,t.id);
    msg='Pasó a '+next.nombre+(n?'. Se avisó a '+n+' persona'+(n>1?'s':''):'');}
  else{t.areaId=null;t.estado='Completada';t.asignado=null;t.hist.push({ts:Date.now(),u:u.id,txt:'Finalizó en '+from+'. Flujo completo'});notify([t.creador],'«'+t.titulo+'» terminó todo el recorrido',t.id);msg='Tarea completada';}
  save();closeModal();render();toast(msg+'.');
}
function backTask(id){
  const t=S.tasks.find(x=>x.id===id),u=cur(),idx=S.areas.findIndex(a=>a.id===t.areaId),prev=S.areas[idx-1];const note=(DRAFT&&DRAFT.comment||'').trim();
  if(!note)return err('Escribe una nota para explicar por qué la devuelves.');
  const from=areaName(t.areaId);t.areaId=prev.id;t.estado='Por hacer';t.asignado=null;t.hist.push({ts:Date.now(),u:u.id,txt:'Devolvió de '+from+' a '+prev.nombre+'. Motivo: '+note});
  const n=notify(recipientsForArea(prev.id),'«'+t.titulo+'» fue devuelta a '+prev.nombre+' desde '+from+'. Motivo: '+note,t.id);
  save();closeModal();render();toast('Devuelta a '+prev.nombre+(n?'. Se avisó a '+n+' persona'+(n>1?'s':''):'')+'.');
}

/* ---------- acciones ---------- */
const ACT={
 nav(el){UI.page=el.dataset.p;UI.q='';UI.f='';UI.menu=false;UI.notif=false;if(UI.page==='config')DRAFT=clone(S.empresa);render();window.scrollTo(0,0);},
 toggleMenu(){UI.menu=!UI.menu;render();},
 login(el){S.session=el.dataset.id;UI.page='dashboard';UI.notif=false;save();render();},
 logout(){S.session=null;UI.menu=false;save();render();},
 bell(){UI.notif=!UI.notif;render();},
 notifAll(){S.notifs.forEach(n=>{if(n.to===S.session)n.read=true;});save();render();},
 notifGo(el){const n=S.notifs.find(x=>x.id===el.dataset.id);if(!n)return;n.read=true;UI.notif=false;save();if(n.link&&S.tasks.some(t=>t.id===n.link)&&can('tareas','ver')){UI.page='tareas';render();openTask(n.link);}else render();},
 closeModal(el,e){if(e.target!==el&&!el.classList.contains('btn')&&!el.classList.contains('ib'))return;closeModal();},
 askOk(){const f=ASK;ASK=null;closeModal();if(f)f();},
 print(){window.print();},
 docNew(el){openDoc(el.dataset.t);},
 docView(el){openPreview(el.dataset.id);},
 docEdit(el){openDoc(S.docs.find(d=>d.id===el.dataset.id).tipo,el.dataset.id);},
 docDel(el){const d=S.docs.find(x=>x.id===el.dataset.id);ask('¿Eliminar '+DT[d.tipo].n.toLowerCase()+' '+d.num+'? Esta acción no se puede deshacer.',()=>{S.docs=S.docs.filter(x=>x.id!==d.id);syncPagos();save();render();toast('Documento eliminado.');},'Eliminar');},
 docSave(el){docSave(el.dataset.go);},
 docAddLine(){DRAFT.items.push({desc:'',qty:1,price:0,iva:DT[DRAFT.tipo].iva?19:0});renderModal();const i=DRAFT.items.length-1;const f=document.querySelector('[data-li="'+i+'"][data-f="desc"]');if(f)f.focus();},
 docDelLine(el){if(DRAFT.items.length<=1){DRAFT.items=[{desc:'',qty:1,price:0,iva:DT[DRAFT.tipo].iva?19:0}];}else DRAFT.items.splice(+el.dataset.i,1);renderModal();},
 docConv(el){convertDoc(el.dataset.id,el.dataset.t);},
 otTask(el){const d=S.docs.find(x=>x.id===el.dataset.id);closeModal();openTaskForm();DRAFT.titulo=d.num+' · '+partyName(d.partyId);DRAFT.desc=d.items.map(i=>i.qty+' × '+i.desc).join('\n');DRAFT.clienteId=d.partyId;DRAFT.docRef=d.num;DRAFT.areaId=S.areas[0].id;DRAFT.vence=d.vence;renderModal();},
 userNew(){openUser();},userEdit(el){openUser(el.dataset.id);},
 userRole(el){UI.f=el.dataset.id;render();},
 userSave(){userSave();},
 userDel(el){const id=el.dataset.id;if(id===S.session)return toast('No puedes eliminar tu propio usuario.');if(userUsed(id))return toast('Tiene documentos, tareas u oportunidades asociados. Márcalo como inactivo en lugar de eliminarlo.');const u=S.users.find(x=>x.id===id);ask('¿Eliminar a '+u.nombre+'?',()=>{S.users=S.users.filter(x=>x.id!==id);save();render();toast('Usuario eliminado.');},'Eliminar');},
 roleSel(el){UI.roleSel=el.dataset.id;render();},
 roleNew(){openRole();},roleEdit(el){openRole(el.dataset.id);},roleSave(){roleSave();},
 roleDel(el){const r=S.roles.find(x=>x.id===el.dataset.id);if(S.users.some(u=>u.rolId===r.id))return toast('Hay usuarios con este rol. Cámbiales el rol primero.');ask('¿Eliminar el rol '+r.nombre+'?',()=>{S.roles=S.roles.filter(x=>x.id!==r.id);UI.roleSel=null;save();render();toast('Rol eliminado.');},'Eliminar');},
 perm(el){const r=S.roles.find(x=>x.id===UI.roleSel);if(!r||r.locked||!can('roles','editar'))return;const m=el.dataset.m,x=el.dataset.x;r.perms[m]=r.perms[m]||{};r.perms[m][x]=!r.perms[m][x];if(x!=='ver'&&r.perms[m][x])r.perms[m].ver=true;if(x==='ver'&&!r.perms[m].ver)r.perms[m]={};save();render();},
 cfgSave(){S.empresa=Object.assign({},DRAFT);save();render();toast('Datos guardados.');},
 areaAdd(){const i=$('#newArea');const n=(i.value||'').trim();if(!n)return toast('Escribe el nombre del área.');S.areas.push({id:'a_'+uid(),nombre:n});save();render();},
 areaUp(el){const i=S.areas.findIndex(a=>a.id===el.dataset.id);if(i>0){[S.areas[i-1],S.areas[i]]=[S.areas[i],S.areas[i-1]];save();render();}},
 areaDown(el){const i=S.areas.findIndex(a=>a.id===el.dataset.id);if(i<S.areas.length-1){[S.areas[i+1],S.areas[i]]=[S.areas[i],S.areas[i+1]];save();render();}},
 areaDel(el){const id=el.dataset.id;if(S.areas.length<=1)return toast('Debe quedar al menos un área.');if(S.tasks.some(t=>t.areaId===id)||S.users.some(u=>u.areaId===id))return toast('Esta área tiene tareas o personas asignadas. Muévelas antes de eliminarla.');S.areas=S.areas.filter(a=>a.id!==id);save();render();},
 backup(){const o=clone(S);o.session=null;openModal(()=>mhead('Copia de seguridad')+'<div class="mb"><p class="sub" style="margin:0">Copia este texto y guárdalo en un archivo. Para restaurar, pégalo en “Restaurar copia”.</p><textarea rows="12" readonly onclick="this.select()" aria-label="Copia de seguridad">'+esc(JSON.stringify(o))+'</textarea></div><div class="mf"><button class="btn" data-a="closeModal">Cerrar</button></div>','');},
 restore(){DRAFT={txt:''};openModal(()=>mhead('Restaurar copia')+'<div class="mb"><p class="sub" style="margin:0">Pega aquí la copia de seguridad. Reemplaza todos los datos actuales.</p>'+fa('txt',DRAFT.txt,10)+'<div class="err" id="err" hidden></div></div><div class="mf"><button class="btn" data-a="closeModal">Cancelar</button><button class="btn pri" data-a="restoreDo">Restaurar</button></div>','');},
 restoreDo(){try{const o=JSON.parse(DRAFT.txt);if(!(o.users&&o.roles&&o.areas&&o.docs&&o.empresa))throw 0;S=o;if(!S.users.some(u=>u.id===S.session))S.session=null;save();closeModal();render();toast('Copia restaurada.');}catch(e){err('Ese texto no es una copia válida.');}},
 resetDemo(){ask('Se borrarán todos tus datos y volverán los de ejemplo. ¿Continuar?',()=>{S=seed();save();UI.page='dashboard';render();toast('Datos de ejemplo restaurados.');},'Restablecer');},
 dealNew(){openDeal();},dealEdit(el,e){if(e.target.closest('button'))return;openDeal(el.dataset.id);},dealSave(){dealSave();},
 dealDel(el){const id=el.dataset.id;ask('¿Eliminar esta oportunidad?',()=>{S.deals=S.deals.filter(d=>d.id!==id);save();render();toast('Oportunidad eliminada.');},'Eliminar');},
 dealMove(el){const d=S.deals.find(x=>x.id===el.dataset.id);const i=STAGES.indexOf(d.etapa)+(+el.dataset.dir);if(i>=0&&i<STAGES.length)moveDeal(d.id,STAGES[i]);},
 dealQuote(el){const d=S.deals.find(x=>x.id===el.dataset.id);openDoc('cotizacion',null,{partyId:d.clienteId||'',items:[{desc:d.titulo,qty:1,price:+d.valor||0,iva:19}]});},
 dealCharge(el){const d=S.deals.find(x=>x.id===el.dataset.id);openDoc('cuenta_cobro',null,{partyId:d.clienteId||'',items:[{desc:d.titulo,qty:1,price:+d.valor||0,iva:0}]});},
 taskNew(){openTaskForm();},taskEdit(el){openTaskForm(el.dataset.id);},taskSave(){taskSave();},
 openTask(el){openTask(el.dataset.id);},
 taskDel(el){const id=el.dataset.id;ask('¿Eliminar esta tarea y su historial?',()=>{S.tasks=S.tasks.filter(t=>t.id!==id);save();render();toast('Tarea eliminada.');},'Eliminar');},
 taskTake(el){const t=S.tasks.find(x=>x.id===el.dataset.id),u=cur();t.asignado=u.id;t.estado='En curso';t.hist.push({ts:Date.now(),u:u.id,txt:'Tomó la tarea'});if(t.creador!==u.id)notify([t.creador],u.nombre+' tomó «'+t.titulo+'»',t.id);save();render();openTask(t.id);},
 taskPass(el){passTask(el.dataset.id);},taskBack(el){backTask(el.dataset.id);},
 taskComment(el){const t=S.tasks.find(x=>x.id===el.dataset.id),txt=(DRAFT.comment||'').trim();if(!txt)return err('Escribe la nota.');t.hist.push({ts:Date.now(),u:S.session,txt:'Nota: '+txt});notify([t.asignado,t.creador],userName(S.session)+' comentó en «'+t.titulo+'»',t.id);save();render();openTask(t.id);}
};
function setD(t){
  const ds=t.dataset,v=t.type==='checkbox'?t.checked:t.value;
  if(ds.li!==undefined){const it=DRAFT.items[+ds.li];if(it)it[ds.f]=(ds.f==='desc')?v:(v===''?'':+v);updateTotals();return;}
  if(ds.d&&DRAFT){DRAFT[ds.d]=(t.type==='number')?(v===''?'':+v):v;if(ds.rr)renderModal();else if(ds.tot)updateTotals();}
}
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]');
  if(!el){if(UI.notif&&!e.target.closest('.notif')){UI.notif=false;render();}return;}
  const h=ACT[el.dataset.a];if(h)h(el,e);
});
document.addEventListener('input',e=>{const t=e.target;if(!t.dataset)return;if(t.dataset.s==='q'){UI.q=t.value;render();}else if(t.dataset.d||t.dataset.li!==undefined)setD(t);});
document.addEventListener('change',e=>{
  const t=e.target,s=t.dataset&&t.dataset.s;
  if(s==='f'){UI.f=t.value;render();}
  else if(s==='dealOwner'){UI.dealOwner=t.value;render();}
  else if(s==='taskMine'){UI.taskMine=t.checked;render();}
  else if(s==='docEstado'){const d=S.docs.find(x=>x.id===t.dataset.id);if(d){d.estado=t.value;d.auto=false;save();render();}}
  else if(s==='areaName'){const a=S.areas.find(x=>x.id===t.dataset.id);if(a&&t.value.trim()){a.nombre=t.value.trim();save();render();}}
  else if(t.dataset&&(t.dataset.d||t.dataset.li!==undefined))setD(t);
});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'){const el=e.target.closest&&e.target.closest('[tabindex][data-a]');if(el&&el.tagName!=='INPUT'&&el.tagName!=='TEXTAREA'){e.preventDefault();el.click();}}
  if(e.key==='Escape'&&MODAL)closeModal();
});
document.addEventListener('dragstart',e=>{const c=e.target.closest&&e.target.closest('[data-deal]');if(c){e.dataTransfer.setData('text/plain',c.dataset.deal);e.dataTransfer.effectAllowed='move';}});
document.addEventListener('dragover',e=>{const c=e.target.closest&&e.target.closest('.col[data-stage]');if(c){e.preventDefault();c.classList.add('over');}});
document.addEventListener('dragleave',e=>{const c=e.target.closest&&e.target.closest('.col[data-stage]');if(c&&!c.contains(e.relatedTarget))c.classList.remove('over');});
document.addEventListener('drop',e=>{const c=e.target.closest&&e.target.closest('.col[data-stage]');if(c){e.preventDefault();c.classList.remove('over');const id=e.dataTransfer.getData('text/plain');if(id)moveDeal(id,c.dataset.stage);}});
render();
})();
</script>
